<!doctype html>
<!-- phrasa.app's link preview (public/og.png, 1200 x 630), in the app's own
     look: the App Store screenshots' violet and the app icon (../public/icon.svg).
     Render it at 1200 x 630, e.g. with ExpoPhrasa's
     distribution/app-store/screenshots/render.mjs. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(90% 80% at 85% 10%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%),
      linear-gradient(150deg, #8A6BFF 0%, #4B2BD6 50%, #1C0E6B 100%);
    padding: 76px 84px; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .brand img { width: 64px; height: 64px; filter: drop-shadow(0 8px 20px rgba(10, 0, 40, 0.45)); }
  h1 { margin: 74px 0 0; font-size: 84px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; max-width: 13ch; }
  h1 em { font-style: normal; color: #FFC24D; }
  p { margin: 26px 0 0; font-size: 30px; font-weight: 500; max-width: 700px; white-space: nowrap; color: rgba(255, 255, 255, 0.86); }
  .mark { position: absolute; right: 40px; bottom: -90px; width: 380px; height: 380px; opacity: 0.95; transform: rotate(-8deg);
    filter: drop-shadow(0 30px 60px rgba(10, 0, 40, 0.5)); }
</style>
</head>
<body>
  <div class="brand"><img src="../public/icon.svg" alt="">Phrasa</div>
  <h1>Read like you&rsquo;re<br><em>not reading.</em></h1>
  <p>A teleprompter that follows your voice as you read.</p>
  <img class="mark" src="../public/icon.svg" alt="">
</body>
</html>
