# Build identity for the shipping iOS candidate.

bundle_id: com.phrasa.app
apple_id: "6780259086"
# Live Connect evidence through 2026-07-29: iOS version 1.0 build 14 was
# archived, exported, uploaded, processed, selected, and submitted. The version
# is WAITING_FOR_REVIEW. See connect-audit.yaml and connect-evidence.yaml.

marketing_version: "1.0"
build_number: "14"
display: "1.0 (14)"
connect_version_status: WAITING_FOR_REVIEW
connect_build_selected: "1.0 (14)"

# Repo evidence
sources:
  project_yml:
    path: ../../project.yml
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "14"
  pbxproj:
    path: ../../PhrasaNative.xcodeproj/project.pbxproj
    expected:
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "14"
  info_plist:
    path: ../../Phrasa/Info.plist
    CFBundleShortVersionString: "$(MARKETING_VERSION)"
    CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

platform: iOS
devices: [iPhone, iPad]
targeted_device_family: "1,2"
minimum_ios: "17.0"

archive_status: archived
export_status: exported
upload_status: uploaded
processing_status: processed
review_submission_status: submitted
review_submission_date: "2026-07-29"

# Important binary boundary: the Fable adversarial hardening commits were made
# after build 14 was submitted. They are source improvements for a later build,
# not claims about the binary currently waiting for review.
post_submission_source_hardening_in_build_14: false

do_not_reuse_builds:
  - "9"   # legacy Expo
  - "10"  # legacy Expo
  - "11"  # prior native lineage
  - "12"  # prior native lineage
  - "13"  # prior native lineage
