# App Store Connect save evidence — machine-validated for --mode submission-ready.
# ---------------------------------------------------------------------------
# Fill this file only after the exact corresponding action is true in Connect.
# Do not invent values. Null / TODO means "not yet proven."
#
# Required for: submission-ready (after upload, processing, selection, saves)
# NOT required for: packet or release-ready
#
# Accessibility labels are optional and are not a submission gate.
# ---------------------------------------------------------------------------

schema: connect-evidence-v1
owner_gated: true
last_updated: "2026-07-29"

# Public app name as saved in App Store Connect (not the temporary name).
